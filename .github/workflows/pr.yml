name: Verify Pull Request

on:
  pull_request:
    branches: [ 'main' ]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner_type:
        type: choice
        required: true
        description: "Runner type"
        default: "self-hosted"
        options:
          - "self-hosted"
          - "macos-26"

env:
  RUBY_VERSION: "4.0"
  XCODE_VERSION: "26.2"

jobs:
  pr:
    name: Verify Pull Request
    runs-on: "${{ github.event.inputs.runner_type || 'self-hosted' }}"
    steps:
      # Checkout the repository under $GITHUB_WORKSPACE
      - name: Checkout Project
        uses: actions/checkout@v6

      # Ensure correct Xcode version is installed.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

       # Install xcbeautify, used by Fastlane instead of xcpretty if available
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      # Set Ruby version and Cache RubyGem dependencies
      - name: Cache RubyGem Dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      # Run RuboCop to lint Ruby code
      - name: Lint Ruby
        run: bundle exec rubocop

      # Run swift format to lint Swift code
      - name: Lint Swift
        run: swift format lint --strict --parallel --recursive NevisExampleApp NevisExampleShareExtension NevisExampleWatchApp Packages/NevisExampleShared

      # Build & Distribute
      - name: Run Fastlane
        run: bundle exec fastlane pr